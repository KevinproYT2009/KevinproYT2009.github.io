<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamenter - Plateforme de Jeux Rétro & Chat</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --accent-color: #007bff;
        }
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f4f4f9;
            --card-bg: #1e1e1e;
            --accent-color: #4dabf7;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            cursor: pointer;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
        }
        .stats-bar {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .game-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-3px);
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        .chat-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #messages-container {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: rgba(0,0,0,0.02);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gamenter</h1>
        <button id="toggleBtn">🌓 Changer de thème</button>
    </header>

    <!-- Barre de statistiques et compteurs -->
    <div class="stats-bar">
        <div>👥 Joueurs en ligne : <span id="nb-live">1</span></div>
        <div>⏱️ Session actuelle : <span id="current-time">00:00</span></div>
        <div>⏳ Temps total sur le site : <span id="total-time">00:00</span></div>
    </div>

    <!-- Section des Jeux -->
    <h2>Jeux disponibles</h2>
    <div class="games-grid">
        <div class="game-card" data-title="Jeu Exemple 1" data-url="https://example.com">
            <h3>Jeu 1</h3>
            <p>Jouer au jeu 1</p>
        </div>
    </div>

    <!-- Modal de jeu -->
    <div id="game-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Titre du jeu</h2>
            <div id="game-container"></div>
            <div style="margin-top: 15px;">
                <button id="fullscreen-button">Plein écran</button>
                <button id="close-button" style="background: #dc3545;">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Section Contact / Captcha -->
    <section style="margin-top: 30px;">
        <h2>Contact</h2>
        <form id="contact-form">
            <p id="question-label">Combien font X + Y ?</p>
            <input type="number" id="captcha-reponse" placeholder="Votre réponse" required>
            <button type="submit">Valider</button>
        </form>
        <div id="confirmation" class="hidden">
            <p style="color: green;">Formulaire validé avec succès !</p>
        </div>
    </section>

    <!-- Section Chat Global -->
    <section class="chat-section" style="margin-top: 30px;">
        <h2>Chat en direct</h2>
        <div id="messages-container"></div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
            <input type="text" id="chat-pseudo" placeholder="Votre pseudo" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
            <input type="password" id="chat-admin-pwd" placeholder="Mot de passe Admin" style="display:none; padding: 8px; border-radius: 5px; border: 1px solid #ff3333;">
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="chat-message" placeholder="Écrire un message..." style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; min-width: 200px;">
            <input type="file" id="chat-file" accept="image/*,video/*,audio/*" style="padding: 5px;">
            <button id="chat-send">Envoyer</button>
        </div>
    </section>

    <!-- Script principal JavaScript -->
    <script type="module" src="script.js"></script>
</body>
</html>
