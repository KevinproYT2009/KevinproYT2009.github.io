<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamenter - Accueil</title>
    <style>
        /* ==========================================
           STYLES DE BASE ET THEME SOMBRE
           ========================================== */
        :root {
            --accent-color: #007bff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .hidden {
            display: none !important;
        }
        
        /* Mode Sombre */
        body.dark-mode {
            background-color: #121212;
            color: #eeeeee;
        }
        .dark-mode input, .dark-mode button {
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
        }

        /* Conteneurs */
        .section {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .dark-mode .section {
            background: #1e1e1e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Chat */
        #messages-container {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            background: #fafafa;
            border-radius: 5px;
        }
        .dark-mode #messages-container {
            background: #181818;
            border-color: #333;
        }
        .chat-inputs {
            display: flex;
            gap: 10px;
        }
        .chat-inputs input[type="text"] {
            flex-grow: 1;
            padding: 10px;
        }

        /* Boutons */
        button {
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }

        /* Jeux / Modal */
        .game-card {
            display: inline-block;
            padding: 20px;
            background: #28a745;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            margin-right: 10px;
            text-align: center;
        }
        #game-modal {
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background: white;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 1000;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .dark-mode #game-modal {
            background: #222;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         EN-TÊTE ET INFORMATIONS GLOBALES
         ========================================== -->
    <div class="section" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1>Gamenter</h1>
            <p>
                🔴 <span id="nb-live">0</span> joueur(s) en ligne <br>
                ⏱️ Temps session : <span id="current-time">00:00</span> | Temps total : <span id="total-time">00:00</span>
            </p>
        </div>
        <button id="toggleBtn">🌓 Changer de thème</button>
    </div>

    <!-- ==========================================
         AUTHENTIFICATION ET PROFIL
         ========================================== -->
    <div class="section">
        <!-- Zone visible si NON connecté -->
        <div id="user-logged-out">
            <h2>Connexion / Inscription</h2>
            <input type="email" id="auth-email" placeholder="Adresse e-mail">
            <input type="password" id="auth-password" placeholder="Mot de passe">
            <input type="text" id="auth-pseudo" placeholder="Pseudo (Inscription seulement)">
            <br><br>
            <button id="btn-login">Se connecter</button>
            <button id="btn-register">Créer un compte</button>
            <button id="btn-google-login" style="background-color: #db4437;">Se connecter avec Google</button>
        </div>

        <!-- Zone visible si CONNECTÉ -->
        <div id="user-logged-in" class="hidden">
            <h2>Bienvenue, <span id="profile-pseudo"></span> !</h2>
            <p>Email associé : <span id="profile-email"></span></p>
            <button id="btn-logout" style="background-color: #dc3545;">Se déconnecter</button>
        </div>
    </div>

    <!-- ==========================================
         CHAT EN DIRECT
         ========================================== -->
    <div class="section">
        <h2>Tchat Public</h2>
        <!-- Le script.js injectera le panneau d'administration juste avant ce conteneur -->
        <div id="messages-container"></div>
        
        <div class="chat-inputs">
            <input type="text" id="chat-message" placeholder="Écris ton message ici...">
            <input type="file" id="chat-file" accept="image/*, audio/*, video/*">
            <button id="chat-send">Envoyer</button>
        </div>
    </div>

    <!-- ==========================================
         SECTION JEUX
         ========================================== -->
    <div class="section">
        <h2>Mini-Jeux</h2>
        <!-- Modifie le data-url pour mettre le lien réel vers tes jeux -->
        <div class="game-card" data-title="Jeu de tir" data-url="https://example.com/jeu1">🎮 Jeu 1</div>
        <div class="game-card" data-title="Jeu de course" data-url="https://example.com/jeu2">🏎️ Jeu 2</div>
    </div>

    <!-- Modale de jeu (Cachée par défaut) -->
    <div id="game-modal" class="hidden">
        <div class="modal-header">
            <h2 id="modal-title">Titre du jeu</h2>
            <div>
                <button id="fullscreen-button">Plein écran</button>
                <button id="close-button" style="background-color: #dc3545;">Fermer ❌</button>
            </div>
        </div>
        <div id="game-container"></div>
    </div>

    <!-- ==========================================
         FORMULAIRE DE CONTACT AVEC CAPTCHA
         ========================================== -->
    <div class="section">
        <h2>Nous contacter</h2>
        <form id="contact-form">
            <p id="question-label">Combien font X + Y ?</p>
            <input type="number" id="captcha-reponse" placeholder="Votre réponse" required>
            <button type="submit">Vérifier et envoyer</button>
        </form>
        <div id="confirmation" class="hidden" style="color: #28a745; font-weight: bold;">
            ✅ Message envoyé avec succès !
        </div>
    </div>

    <!-- Import du Script Principal (Doit être en type="module") -->
    <script type="module" src="script.js"></script>

</body>
</html>
